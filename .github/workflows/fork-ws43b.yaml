# fork: WS43B_FORK 빌드와 설치 파일 묶음, main이면 웹 설치 페이지(GitHub Pages) 배포. 업스트림 ci.yaml(전 플랫폼 빌드)과 별개로 돈다.
name: Fork WS43B build

on:
  push:
    branches: ['**']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fork hooks and skins partition size
        run: ./tools/check_fork_hooks.sh

      - name: Host tests (no hardware)
        run: ./source/test_host/run_tests.sh

      - name: esp-idf build WS43B_FORK
        uses: espressif/esp-idf-ci-action@v1
        with:
          path: 'source'
          esp_idf_version: v6.0.2
          target: esp32s3
          extra_docker_args: -e IDF_PRESET=WS43B_FORK
          command: "idf.py build"

      - name: Package
        run: |
          B=source/build/fork_ws43b
          mkdir -p out/usb out/ota
          cp "$B/bootloader/bootloader.bin" "$B/partition_table/partition-table.bin" "$B/ota_data_initial.bin" \
             "$B/TonexController.bin" source/skin_images/16bit/skins.bin tools/flash_fork_ws43b.py out/usb/
          # flat folder: keep offsets, drop directories from the file names
          python3 tools/flatten_flasher_args.py "$B/flasher_args.json" out/usb/flasher_args.json
          cp "$B/TonexController.bin" out/ota/
          python3 tools/web_installer/build_site.py "$B" out/site

      - name: Upload USB install package
        uses: actions/upload-artifact@v4
        with:
          name: ws43b-fork-usb-install
          path: out/usb
          if-no-files-found: error

      - name: Upload WiFi update image
        uses: actions/upload-artifact@v4
        with:
          name: ws43b-fork-wifi-update
          path: out/ota
          if-no-files-found: error

      - name: Upload web installer (GitHub Pages)
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: out/site

  deploy-pages:
    # github-pages 환경의 기본 규칙이 기본 브랜치(main)만 배포를 허용한다.
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
